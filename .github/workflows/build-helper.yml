name: Build desktop helper

on:
  push:
    branches: [codex/comfyui-custom-nodes]
    paths: [pc_helper.py, desktop_helper.py, 'desktop/**', '.github/workflows/build-helper.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: windows-x64
          - os: macos-15
            asset: macos-arm64
          - os: macos-15-intel
            asset: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'pyinstaller>=6.16,<7'
      - run: python desktop_helper.py --smoke-test
      - run: python desktop/build.py
      - name: Verify and archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = 'desktop/dist/ComfyUI Codex Helper.exe'
          $process = Start-Process -FilePath $app -ArgumentList '--smoke-test' -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Packaged desktop app failed smoke test' }
          Compress-Archive -LiteralPath $app -DestinationPath 'desktop/dist/ComfyUI-Codex-Helper-${{ matrix.asset }}.zip'
      - name: Verify and archive macOS app
        if: runner.os == 'macOS'
        run: |
          'desktop/dist/ComfyUI Codex Helper.app/Contents/MacOS/ComfyUI Codex Helper' --smoke-test
          ditto -c -k --keepParent 'desktop/dist/ComfyUI Codex Helper.app' 'desktop/dist/ComfyUI-Codex-Helper-${{ matrix.asset }}.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: ComfyUI-Codex-Helper-${{ matrix.asset }}
          path: desktop/dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish desktop downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view helper-v0.9.0 || gh release create helper-v0.9.0 --target "$GITHUB_SHA" --title 'Codex Desktop Helper 0.9.0' --prerelease --notes 'Windows and macOS desktop apps. Paste the ComfyUI URL to connect and switch pods. Requires custom nodes 0.9.0+ and a local ChatGPT-signed-in Codex installation. macOS apps are unsigned.'
          gh release upload helper-v0.9.0 release-assets/*.zip --clobber
